# Create a database role and store the finished connection URL.
#
# The password is generated by the server, exists only inside the runner's subprocess and in
# Postgres, and is stored as part of a composed DATABASE_URL. The agent that triggers this
# receives an acknowledgement and nothing else.

[pg-provision]
adapter = "postgres-role"
runner  = "prod-cluster"          # in-cluster, so it can reach an RDS that is not on the internet

# Structured parameters only. There is no field here that takes SQL, and that is deliberate: it
# is what keeps this adapter unable to do what a script could.
config = {
  host       = "pgm-xxx.rds.aliyuncs.com",
  database   = "utopia",
  role_prefix = "utopia_app",
  privileges = ["CONNECT", "SELECT", "INSERT", "UPDATE", "DELETE"],
}

# The admin connection URL this adapter uses to create the new role.
secrets = { admin = "pg/prod-admin-url" }

# sealbox-cli rotate utopia/prod/database-url --via pg-provision --from-output
#
# Creates utopia_app_2 with the new password, leaves utopia_app_1 working, and emits the new
# connection URL. Dropping the old role is a separate grant, run once something has verified the
# new one works.
#
# --from-output stores what the adapter printed (the composed URL) rather than the raw generated
# password. Percent-encoding is the adapter's problem, not yours.
