# The escape hatch: a provider no adapter covers.
#
# Reach for this only when no adapter fits. A script can do anything its declared secrets permit;
# an adapter cannot. When you find yourself writing the same script twice, that is the signal to
# propose it as an adapter — and the only accepted reason to add one.

[exotic-provider-key]
runner  = "prod-cluster"
secrets = { API_TOKEN = "exotic/admin-token" }

# Stored in sealbox, not referenced by path: a grant pointing at a file could be approved once and
# the file edited afterwards, so what was reviewed and what runs would differ.
script = """
#!/usr/bin/env bash
set -euo pipefail

# $SEALBOX_NEW is generated by the server. Never generate secret material here.
exotic-cli credentials create --token "$API_TOKEN" --secret "$SEALBOX_NEW" >&2

# stdout becomes the stored value when invoked with --from-output.
printf 'https://%s@api.exotic.example/v1' "$SEALBOX_NEW"
"""

command = ["{script}", "{account}"]

# sealbox-cli rotate exotic/api-url --via exotic-provider-key --from-output account=prod
