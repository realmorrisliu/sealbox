# Provision the role the service runs as, and push the result straight into Kubernetes.
#
# The password is generated by the server, exists only inside the runner's subprocess and in
# Postgres, and reaches Kubernetes as part of a composed URL. Nobody sees it — not the agent that
# triggered this, not you.

[utopia-dev-runtime]
adapter = "postgres-role"
runner  = "prod-cluster"          # in-cluster, so it can reach an RDS that is not on the internet

# On success, push the new URL into the cluster. The chain runs on the server *after* the rotation
# commits, so what gets synced is the value that was just committed — not the one it replaced.
then = ["utopia-dev-sync"]

# The RDS privileged account. It must be a member of `owner`; utopia-dev-owner arranges that when
# it creates the role.
[utopia-dev-runtime.secrets]
admin = "pg/rds-dev-admin-url"

[utopia-dev-runtime.config]
host        = "pgm-xxx.rds.aliyuncs.com"
port        = 5432
database    = "utopia-system-dev"
role_prefix = "utopia_system_dev_runtime"
privileges  = ["CONNECT", "SELECT", "INSERT", "UPDATE", "DELETE"]

# The role migrations run as — created by utopia-dev-owner.
#
# Required, and not inferred from the admin connection. `GRANT … ON ALL TABLES` covers only the
# tables that exist at that moment, so a role provisioned into an empty database would see nothing
# at all; `ALTER DEFAULT PRIVILEGES FOR ROLE <owner>` is what covers the tables the migrator
# creates afterwards. Default privileges attach to whoever *creates* an object, so naming the
# wrong role here fails silently — everything reports success and the service cannot read a single
# table.
owner       = "utopia_migrator"

# sealbox-cli rotate utopia/dev/database-url --via utopia-dev-runtime --from-output
#
# Creates utopia_system_dev_runtime_2 with a new password, leaves _1 working until something drops
# it, composes the URL with the password percent-encoded, stores it, and syncs it. If any step
# fails the previous value is still current, and the cluster still holds a credential that works.
